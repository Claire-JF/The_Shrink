# ═══════════════════════════════════════════════════════════════════════
# SECTION 8: Official Docs Analysis（官方文档分析）
# ═══════════════════════════════════════════════════════════════════════
# Sources:
#   - Claude API Docs: Prompt engineering overview
#   - Claude API Docs: Prompting best practices
#   - Claude API Docs: Console prompting tools (Prompt Improver)
#   - OpenAI API Docs: Citation Formatting
# ═══════════════════════════════════════════════════════════════════════

official_docs_insights:

  # ── Claude 官方推荐的核心原则 ──
  claude_best_practices:
    - id: be_clear_direct
      principle: "清晰直接"
      detail: >
        Claude 对明确、显式的指令响应最好。
        黄金法则：把 prompt 给一个没有背景的同事看，
        如果他会困惑，Claude 也会。
      impact_on_shrink: >
        我们的 scoring 维度 "clarity" 与此直接对应。
        重写时应将模糊表述转为具体指令。

    - id: add_context_motivation
      principle: "解释 WHY，不只是 WHAT"
      detail: >
        告诉 Claude 为什么需要某种行为比只说 "做 X" 更有效。
        例如 "不要用省略号" → "你的输出会被 TTS 引擎朗读，
        TTS 无法发音省略号"。Claude 会从解释中自动泛化规则。
      impact_on_shrink: >
        optimization prompt 中的 Constraints 应包含 rationale，
        不只是规则本身。

    - id: use_examples_effectively
      principle: "3-5 个多样化示例"
      detail: >
        Few-shot 是最可靠的输出格式控制手段。
        示例应：相关、多样（覆盖边界情况）、用 XML 标签包裹。
      impact_on_shrink: >
        当前 optimization prompt 没有 few-shot examples。
        这是一个可以实验的改进方向（见 open_questions q3）。

    - id: xml_tags_structure
      principle: "用 XML 标签结构化 prompt"
      detail: >
        XML 标签帮助 Claude 无歧义地解析复杂 prompt。
        用一致的、描述性的标签名包裹不同类型的内容
        （<instructions>、<context>、<examples>、<output_format>）。
      impact_on_shrink: >
        我们的 AI-Intent v2 目前用 ## Markdown headers。
        Claude 官方推荐 XML tags。
        关键问题：The Shrink 的输出是给 *用户* 看的（不是给 AI 看的），
        所以 Markdown headers 可能更友好。
        但 system prompt 本身（给 AI 看的）应该用 XML tags。
      decision: >
        SYSTEM PROMPT（src/prompts/*）→ 使用 XML tags
        OPTIMIZED OUTPUT（给用户看的重写结果）→ 使用 Markdown headers
        这样区分"AI 读的"和"人读的"两个层面。

    - id: role_in_system_prompt
      principle: "在 system prompt 中设置角色"
      detail: >
        即使一句话也能显著影响 Claude 的行为和语气。
        例如 "You are a helpful coding assistant specializing in Python."
      impact_on_shrink: >
        当前 optimization.js 已经做了：
        "You are a prompt architect."
        这与官方推荐一致。

    - id: long_context_ordering
      principle: "长文本放顶部，查询放底部"
      detail: >
        在 prompt 中，把长文档/输入放在顶部，查询/指令放在底部，
        可以提升性能高达 30%（尤其是复杂的多文档输入）。
      impact_on_shrink: >
        对应 buildOptimizationMessages()：
        目前 system prompt 在前、user content 在后——符合官方建议。
        但 user message 中原始 prompt 应在 scores 之前（先数据后指令）。
      action_item: "检查 optimization.js 中 user message 的内容顺序"

    - id: positive_over_negative
      principle: "说'做什么'优于说'不做什么'"
      detail: >
        "不要用 markdown" → "用流畅的散文段落回复"。
        正面指令比负面指令更有效。
      impact_on_shrink: >
        与 YAML Section 4 的 Constraints 规则一致：
        "正面约束优于负面约束：'Use X' > 'Don't use Y'"

  # ── Claude Prompt Improver 的 4 步流程 ──
  # 这是 Claude Console 内置的 prompt 改进器的工作方式
  claude_prompt_improver:
    description: >
      Claude 官方的 Prompt Improver 使用 4 步流程改进 prompt。
      这与我们的 The Shrink optimizer 是竞品/参考。
    steps:
      - step: 1
        name: "Example Identification"
        action: "从 prompt 模板中定位并提取示例"
      - step: 2
        name: "Initial Draft"
        action: "创建带清晰 section 和 XML 标签的结构化模板"
      - step: 3
        name: "Chain of Thought Refinement"
        action: "添加并细化详细的推理指令"
      - step: 4
        name: "Example Enhancement"
        action: "更新示例以展示新的推理过程"

    output_features:
      - "详细的 chain-of-thought 指令引导 Claude 推理"
      - "用 XML 标签组织不同组件"
      - "标准化的示例格式，展示从输入到输出的逐步推理"
      - "策略性 prefill 引导初始响应"

    key_observation: >
      Prompt Improver 生成的模板往往更长、更详细、响应更慢。
      Claude 官方明确说：对延迟/成本敏感的应用应使用更简单的 prompt。
      → 这与 The Shrink 的 token_efficiency 目标存在张力。
      我们需要在 "结构化详细" 和 "精简高效" 之间找到平衡。

    vs_the_shrink: >
      Claude Prompt Improver 做的事和 The Shrink optimizer 非常类似，
      但侧重点不同：
      - Improver：侧重添加 CoT、XML 结构、示例 → 让 AI 输出更准确
      - The Shrink：侧重 clarity + safety + emotional balance → 让用户 prompt 更好
      The Shrink 应该借鉴 Improver 的结构化方法，
      但目标是压缩+净化而非扩展+详化。

  # ── OpenAI Citation Formatting 的启示 ──
  openai_citation_insights:
    description: >
      OpenAI 的 citation formatting 文档虽然专注于引用格式，
      但其结构化思路对 prompt 设计有普遍启示。
    key_takeaways:
      - id: stable_identifiers
        insight: "使用稳定、一致的标识符"
        detail: >
          OpenAI 的 citation 系统要求 source ID 跨运行保持一致。
          类似地，我们的 prompt section IDs（role, task, constraints...）
          应该是固定的、可预测的。

      - id: explicit_format_spec
        insight: "明确的格式规范比自然语言描述更可靠"
        detail: >
          OpenAI 推荐精确定义输出格式的每个组件（marker、delimiter、ID格式）。
          我们的 optimization output 也应该有精确的 JSON schema。

      - id: familiar_patterns
        insight: "使用 AI 熟悉的模式"
        detail: >
          "To maintain maximum accuracy, use familiar citation patterns.
          Custom or unfamiliar formats increase cognitive load on the model."
          → 我们的 prompt 重写模式也应该使用 AI 常见的结构
          （## headers、bullet lists、JSON output），
          不要发明 AI 不熟悉的自定义格式。

  # ── 综合结论：对 YAML Section 1 (AI-Intent v2) 的修订建议 ──
  synthesis:
    structural_decision: >
      [APPLIED 2026-05-10] 已应用到 src/prompts/optimization.js：
      
      Layer 1 — System Prompt（给 AI 读的）：
        使用 XML tags（<output_structure>, <rewriting_rules>, <protected_regions>...）
      
      Layer 2 — Optimized Output（给用户读的）：
        由 AI 自行决定格式（Markdown headers 或散文），
        取决于用户原始 prompt 的风格。

    ordering_decision: >
      [APPLIED 2026-05-10] 已应用到 buildOptimizationMessages()：
      User message 构建顺序：
        1. <original_prompt>（长文本/数据 — 在前）
        2. <quality_scores>（评分结果）
        3. <protected_note>（如有）
        4. Rewrite instruction（重写指令 — 在后，利用 recency effect）

    example_decision: >
      [APPLIED 2026-05-10] 已在 system prompt 中加入 1 个最小 example：
      低 clarity + 高 safety/emotionalBalance 的 prompt → 结构化重写。
      成本约 +250 tokens，换取输出格式稳定性。

    q1_update: >
      [RESOLVED] Role→Task→Context→Constraints→Format 顺序已确认并应用。
      Claude 官方推荐 Role → 长文本数据 → 指令/约束 与此一致。
